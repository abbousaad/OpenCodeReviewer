<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — OpenCodeReviewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>OpenCodeReviewer</h1>
        <p class="subtitle">AI code review</p>
      </div>
      <nav>
        <a href="/" aria-current="page">Dashboard</a>
        <a href="/repos.html">Repositories</a>
        <a href="/settings.html">Settings</a>
        <button type="button" id="logout" class="secondary">Sign out</button>
      </nav>
    </header>

    <main class="wide">
      <section class="stats" aria-label="Usage">
        <div class="stat">
          <span class="stat-label">Spent · all time</span>
          <span class="stat-value" id="stat-total">—</span>
          <span class="stat-note" id="stat-total-note"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Spent · <span id="stat-month-name">this month</span></span>
          <span class="stat-value" id="stat-month">—</span>
          <span class="stat-note" id="stat-month-note"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Tokens · all time</span>
          <span class="stat-value" id="stat-tokens">—</span>
          <span class="stat-note" id="stat-tokens-note"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Queue</span>
          <span class="stat-value" id="stat-queue">—</span>
          <span class="stat-note" id="stat-queue-note"></span>
        </div>
      </section>

      <section class="panel">
        <h2>New review</h2>
        <form id="review-form">
          <div class="form-grid">
            <label class="span-2">
              Repository <a class="hint-link" href="/repos.html">manage</a>
              <select id="repo-select" required></select>
            </label>
            <label>
              Severity gate
              <select id="severityGate">
                <option value="info">info</option>
                <option value="minor">minor</option>
                <option value="major" selected>major</option>
                <option value="critical">critical</option>
              </select>
            </label>
            <label>
              Model
              <input id="model" placeholder="deepseek/deepseek-flash" />
            </label>
          </div>
          <div class="actions">
            <button type="submit" id="start-btn">Start review</button>
            <span class="hint" id="root-hint"></span>
          </div>
        </form>
        <div id="banner" class="banner hidden" role="alert"></div>
      </section>

      <section class="panel flush">
        <div class="panel-head">
          <h2>Runs</h2>
          <span class="hint" id="runs-count"></span>
        </div>
        <div class="table-wrap">
          <table class="runs">
            <thead>
              <tr>
                <th>Status</th>
                <th>Repository</th>
                <th>Findings</th>
                <th class="num">Cost</th>
                <th class="num">Duration</th>
                <th>Started</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="runs"></tbody>
          </table>
        </div>
        <p class="empty hidden" id="runs-empty">No runs yet. Start a review above.</p>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="app.js"></script>
  </body>
</html>
